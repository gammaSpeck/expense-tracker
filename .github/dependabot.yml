version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    # vite-plus must move in lockstep with the `vite` -> @voidzero-dev/vite-plus-core alias, which
    # Dependabot can't update (voidzero-dev/vite-plus#2356). Upgrade with:
    #   bunx --package vite-plus@<version> vp migrate --no-interactive
    ignore:
      - dependency-name: "vite-plus"
    groups:
      bun-patch-and-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-patch-and-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
