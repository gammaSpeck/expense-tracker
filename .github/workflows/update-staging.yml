# This is done only as a workaround to Netlify's branch based deploys for staging env
name: Update Staging
run-name: Update staging to ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy_staging:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'feat') ||
      startsWith(github.event.head_commit.message, 'fix')
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Push checked-out ref to staging
        run: |
          set -euo pipefail
          echo "Pushing ${{ github.ref_name }} (${{ github.sha }}) to origin/staging"
          git push -f origin HEAD:refs/heads/staging
