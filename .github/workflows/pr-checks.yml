name: PR Checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: >-
      startsWith(github.head_ref, 'feat/') || startsWith(github.head_ref, 'fix/') ||
      github.actor == 'dependabot[bot]'
    uses: ./.github/workflows/e2e.yml
    with:
      environment: local

  fallow:
    name: Fallow analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: fallow-rs/fallow@v3
        id: fallow-audit
        with:
          command: audit
          format: sarif
          gate: new-only
          comment: true
          artifacts-dir: fallow-audit-out
      - name: Tag audit SARIF runs with distinct categories
        if: always()
        run: |
          jq '.runs |= [range(length) as $i | .[$i] + {automationDetails: {id: ("fallow-audit-" + ($i|tostring) + "/")}}]' \
            fallow-audit-out/fallow-results.sarif > fallow-audit-out/fallow-results.tagged.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: fallow-audit-out/fallow-results.tagged.sarif
      - uses: fallow-rs/fallow@v3
        id: fallow-security
        if: always()
        with:
          command: security
          format: sarif
          fail-on-issues: false
          artifacts-dir: fallow-security-out
      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: fallow-security-out/fallow-results.sarif
          category: fallow-security
      - name: Health score gate
        if: always()
        run: bunx fallow health --score --min-score 95

  release-notes:
    name: Release notes reminder
    if: >-
      github.event.action == 'opened' &&
      (startsWith(github.head_ref, 'feat/') || startsWith(github.head_ref, 'fix/'))
    runs-on: ubuntu-slim
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Remind when user-facing code changed without a release note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.number }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          files=$(gh pr diff "$PR" --repo "$TARGET_REPO" --name-only)
          echo "$files" | grep -q '^src/' || exit 0
          echo "$files" | grep -qx 'src/content/releaseNotes.ts' && exit 0
          gh pr comment "$PR" --repo "$TARGET_REPO" --body \
            'Does this change need a user-facing note? `src/**` changed but `src/content/releaseNotes.ts` did not. If a user would notice this change, add one entry (benefit first, no jargon) with `version` set to the next release. Refactors, tests, tooling and dependency bumps need nothing — ignore this comment.'
